# Read the Docs build (https://docs.readthedocs.io/en/stable/config-file/v2.html).
# Same command locally: uv run --extra docs sphinx-build -b html docs docs/_build/html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
