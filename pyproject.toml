[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbepi"
version = "0.1.0"
description = "Python/pypulseq port of ArbEPI: 3D-EPI sequences from arbitrary ky-kz sampling masks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pypulseq>=1.5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
    "hdf5storage>=0.2",
    "numba>=0.66.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest"]
lint = ["ruff>=0.6"]
# Raw scanner data -> reconstruction-ready files (preprocess/). Deliberately
# excludes BART and hmriutils: coil whitening/compression are plain numpy, and
# ESPIRiT smaps and the ramp-sample gridding use sigpy instead (see CLAUDE.md's
# preprocess/ section for why). Raw ScanArchive reading needs GE's proprietary
# GERecon SDK, which is NOT pip-installable and NOT listed here -- it must be
# installed separately by the user (see preprocess/README.md), and its
# compiled extension is ABI-locked to Python 3.10 with numpy<2.0, so this extra
# needs its own dedicated 3.10 venv (`.venv-preprocessing`) rather than
# sharing the main sequence-generation environment.
preprocessing = [
    "sigpy>=0.1.26",
    "h5py>=3.10",
    "scipy>=1.10",
    "nibabel>=5.0",
]
# Image reconstruction (recon/): iterative SENSE with B0/R2* and low-rank /
# wavelet-TV priors, started as a port of ../mslr-recon (Julia/MIRT.jl) on
# PyTorch/mirtorch. Deliberately excluded from the core and `preprocessing`
# dependency sets: torch is a large, often CUDA-version-specific install (see
# recon/README.md's setup section). Unlike `preprocessing`, it is installed from
# uv.lock, into its own venv so syncing the main `.venv` without this extra
# doesn't uninstall torch (`uv sync` is exact):
#   UV_PROJECT_ENVIRONMENT=.venv-recon uv sync --extra recon --extra test
recon = [
    "torch>=2.2",
    "mirtorch>=0.3.1",
    "h5py>=3.10",
    "nibabel>=5.0",
    "PyWavelets",  # wavelet filter taps for recon/regularizers.py's Wavelet3D
    "scipy>=1.10",  # needed by mirtorch; floor pinned here
    "matplotlib",  # recon/utils.py's tSNR report figures
    "ipykernel",  # to run recon/demo.ipynb in this venv
    "nbclient",  # to execute notebooks from scripts (nbclient.NotebookClient)
]
# fMRI experiment simulation (simulate_fmri/): SNAKE-fMRI acquisitions driven by
# ArbEPI's own sampling schedules. snake-fmri is pinned to a GitHub commit, not
# PyPI: the PyPI release (0.2.0) predates the FOVConfig/affine API that
# simulate_fmri/ and the upstream documentation use. ismrmrd 1.15 made
# ismrmrdHeader's experimentalConditions a required argument, which snake's MRD
# writer does not pass. Installed into its own venv together with `recon`, so
# a simulated dataset can be reconstructed and scored in one environment:
#   UV_PROJECT_ENVIRONMENT=.venv-simulate uv sync --extra simulate --extra recon --extra test
simulate = [
    "snake-fmri @ git+https://github.com/mind-inria/snake-fmri@ed04e155d16ab5fd1d434f8250af43a84d3d4eb6",
    "ismrmrd>=1.14,<1.15",
    "h5py>=3.10",
    "nibabel>=5.0",
    "matplotlib",
    "ipykernel",  # to run simulate_fmri/demo.ipynb in this venv
    "nbclient",
]

# snake-fmri requires mri-nufft[finufft,cufinufft]; the cufinufft extra pulls
# cupy-cuda13x and the CUDA 13 toolkit wheels (several GB, Linux/Windows and one
# CUDA major version only). simulate_fmri/ uses snake's Cartesian engine, which
# needs neither, so the requirement is narrowed to the CPU NUFFT backend.
[tool.uv]
override-dependencies = ["mri-nufft[finufft]>=1.0"]

[tool.setuptools]
py-modules = ["params", "scanners"]

[tool.setuptools.packages.find]
include = [
    "sample*", "lib*", "sequences*", "plot*", "ge*", "preprocess*", "recon*", "simulate_fmri*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
