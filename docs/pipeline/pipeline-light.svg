<text x="76" y="50" class="t-mono-b">scanners.py</text>
<text x="76" y="66" class="t-text">ScannerSpec: GE_MR750 | GE_UHP</text>
<text x="76" y="82" class="t-text">max gradient, slew, B1, PNS;</text>
<text x="76" y="98" class="t-text">ge/ checks read the same spec</text>
