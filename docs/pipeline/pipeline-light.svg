<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1600" width="1100" height="1600" role="img" aria-label="ArbEPI workflow: scan configuration, sampling masks and echo-train partitioning produce four Pulseq sequences (deGRE, noise, EPIcal, ArbEPI); these are exported to GE .pge files and run on the scanner; each sequence&#x27;s raw ScanArchive feeds its own preprocessing step (whitening, odd/even calibration, gridding, coil maps and B0); the preprocessed file feeds RSS or iterative SENSE reconstruction. scan_info.mat bypasses the scanner and carries the sampling schedule to preprocessing.">
<title>ArbEPI pipeline</title>
<style>svg { --bg: #f5f6f8; --fg: #19212c; --muted: #586273; --line: #3d4757; --box: #ffffff; --chip: #e6eaf0; --seq-band: #e7edf7; --seq: #2f5d9e; --scan-band: #f2ece2; --scan: #8d5f22; --pre-band: #e4f1ea; --pre: #2a7250; --rec-band: #eee8f6; --rec: #664a9c; --hand: #bb4a24; --hand-bg: #fbe9e1; }
.bg { fill: var(--bg); }
.band { stroke: none; }
.band.seq { fill: var(--seq-band); } .band.scan { fill: var(--scan-band); }
.band.pre { fill: var(--pre-band); } .band.rec { fill: var(--rec-band); }
.rail { font: 600 11px "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; letter-spacing: .12em; }
.rail.seq { fill: var(--seq); } .rail.scan { fill: var(--scan); }
.rail.pre { fill: var(--pre); } .rail.rec { fill: var(--rec); }
.box { fill: var(--box); stroke-width: 1.5; }
.box.seq { stroke: var(--seq); } .box.scan { stroke: var(--scan); }
.box.pre { stroke: var(--pre); } .box.rec { stroke: var(--rec); }
.box.plain { stroke: var(--line); }
.box.key { stroke-width: 2.5; }
.box.dashed { stroke-dasharray: 5 4; }
.group { fill: none; stroke: var(--pre); stroke-width: 1; stroke-dasharray: 3 3; }
.chip { fill: var(--chip); stroke: none; }
.chip.hand { fill: var(--hand-bg); stroke: var(--hand); stroke-width: 1.5; }
.flow { fill: none; stroke: var(--line); stroke-width: 1.5; }
.flow.dashed { stroke-dasharray: 5 4; }
.hand { fill: none; stroke: var(--hand); stroke-width: 2; stroke-dasharray: 7 5; }
.ah { fill: var(--line); }
.ah-hand { fill: var(--hand); }
.t-title { font: 600 14px "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; fill: var(--fg); }
.t-mono { font: 400 12px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: var(--muted); }
.t-mono-s { font: 400 11px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: var(--muted); }
.t-mono-b { font: 600 12.5px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: var(--fg); }
.t-text { font: 400 12.5px "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; fill: var(--fg); }
.t-chip { font: 500 12px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: var(--fg); }
.t-edge { font: 600 11.5px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: var(--fg); }
.t-section { font: 600 12.5px "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; fill: var(--muted); letter-spacing: .02em; }
.t-legend { font: 400 12.5px "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; fill: var(--muted); }
.t-note { font: 400 11.5px "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; fill: var(--hand); }
.t-note-b { font: 600 11.5px "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; fill: var(--hand); }
.t-note-mono { font: 400 11px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: var(--hand); }
</style>
