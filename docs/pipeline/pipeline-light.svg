<text x="30" y="1157.0" transform="rotate(-90 30 1157.0)" text-anchor="middle" class="rail pre">PREPROCESS · .venv-preprocessing</text>
<rect x="0" y="1390" width="1100" height="158" rx="10" class="band rec"/>
<text x="30" y="1469.0" transform="rotate(-90 30 1469.0)" text-anchor="middle" class="rail rec">RECON · .venv-recon</text>
